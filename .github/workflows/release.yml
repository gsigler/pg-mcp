name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0). Leave empty to bump from package.json."
        required: false
        default: ""
      bump:
        description: "When tag is empty, which semver segment to increment"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          current="$(node -p "require('./package.json').version")"

          bump_semver() {
            local cur="$1" kind="$2"
            local major minor patch
            IFS=. read -r major minor patch <<< "${cur%%-*}"
            case "$kind" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "${major}.$((minor + 1)).0" ;;
              patch) echo "${major}.${minor}.$((patch + 1))" ;;
              *) echo "unknown bump kind: $kind" >&2; exit 1 ;;
            esac
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            version="${INPUT_TAG#v}"
            tag="v${version}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$(bump_semver "$current" "${INPUT_BUMP:-patch}")"
            tag="v${version}"
          else
            version="$(bump_semver "$current" patch)"
            tag="v${version}"
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Bump version files
        if: steps.meta.outputs.version != steps.meta.outputs.current
        run: bash .github/scripts/bump-version.sh "${{ steps.meta.outputs.version }}"

      - name: Commit, tag, and push
        if: steps.meta.outputs.version != steps.meta.outputs.current
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
          git tag -a "${TAG}" -m "pg-mcp ${VERSION}"
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Tag current commit when version already matches
        if: steps.meta.outputs.version == steps.meta.outputs.current
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "pg-mcp ${{ steps.meta.outputs.version }}"
          git push origin "${TAG}"

  build:
    needs: version
    if: needs.version.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: -- --target universal-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            build-args: ""

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build ${{ matrix.build-args }}

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/
          tar -czf release-artifacts/pg-mcp_universal.app.tar.gz \
            -C src-tauri/target/universal-apple-darwin/release/bundle/macos \
            pg-mcp.app
          cp src-tauri/target/universal-apple-darwin/release/pg-mcp \
            "release-artifacts/pg-mcp_${VERSION}_universal-apple-darwin"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-artifacts/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    needs:
      - version
      - build
    if: needs.version.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "pg-mcp $TAG" \
              --notes "" \
              --draft
          fi

          gh release upload "$TAG" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
